name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.1
      - run: ruff check .

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # Que las migraciones apliquen de verdad contra Postgres, no solo que el
  # archivo exista. `alembic check` además falla si alguien tocó un modelo
  # y se le olvidó generar la migración.
  migraciones:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: olivosport
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/olivosport
      SECRET_KEY: clave-solo-para-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - name: Los modelos y las migraciones no se desincronizaron
        run: alembic check
      - name: El downgrade también funciona
        run: alembic downgrade base
      - name: Las migraciones de datos no pierden nada
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/olivosport
        run: pytest tests/test_migracion_imagenes.py -q

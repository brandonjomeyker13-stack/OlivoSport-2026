[pytest]
testpaths = tests

# La app se importa como `app.*`, así que la raíz del repo tiene que estar
# en sys.path. `python -m pytest` la agrega solo; `pytest` a secas (como
# corre en CI) no.
pythonpath = .

# Valores de prueba: `app.core.config` los lee al importarse, así que
# tienen que existir antes de que cualquier test importe la app. Ninguno
# es un secreto real — la base de los tests es SQLite en memoria.
env =
    DATABASE_URL=sqlite+pysqlite:///:memory:
    SECRET_KEY=clave-solo-para-tests
    ENVIRONMENT=local
    WOMPI_PUBLIC_KEY=pub_test_llave_de_prueba
    WOMPI_INTEGRITY_SECRET=integrity-solo-para-tests
    WOMPI_EVENTS_SECRET=events-solo-para-tests
    WOMPI_CURRENCY=COP
